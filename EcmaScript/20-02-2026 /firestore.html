<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Firestore Quotes</title>

    <style>
      body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }

      h1 {
        color: white;
        margin-top: 30px;
        text-align: center;
      }

      #quoteInput {
        padding: 12px;
        width: 280px;
        border-radius: 25px;
        border: none;
        outline: none;
        font-size: 16px;
        margin-right: 10px;
      }

      #addBtn {
        padding: 12px 20px;
        border-radius: 25px;
        border: none;
        background-color: #ff7eb3;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }

      #addBtn:hover {
        background-color: #ff4f81;
        transform: scale(1.05);
      }

      #quoteList {
        list-style: none;
        padding: 0;
        margin-top: 30px;
        width: 350px;
      }

      #quoteList li {
        background: white;
        padding: 15px 20px;
        margin-bottom: 15px;
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        font-style: italic;
        position: relative;
        animation: fadeIn 0.5s ease-in-out;
      }

      #quoteList li::before {
        content: "“";
        font-size: 30px;
        color: #764ba2;
        position: absolute;
        left: 10px;
        top: -10px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <h1>Firestore Database</h1>
    <h1>Quotation</h1>

    <div>
      <input type="text" placeholder="Enter your quote" id="quoteInput" />
      <button id="addBtn">Add Quote</button>
    </div>

    <ul id="quoteList"></ul>

    <script src="firestore.js" type="module"></script>
  </body>
</html>
